name: Codex subscription tasks

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  authorize:
    if: github.event.repository.private == true && github.event.sender.type == 'User'
    runs-on: ${{ fromJSON(vars.CODEX_AUTH_RUNS_ON) }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      allowed: ${{ steps.request.outputs.allowed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: request
        uses: actions/github-script@v7
        with:
          retries: 0
          script: |
            const { authorize } = await import(`${process.env.GITHUB_WORKSPACE}/.github/codex/automation.mjs`);
            core.setOutput('allowed', await authorize(github, context));

  work:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    # Use one dedicated runner, or an equivalent external lock. Do not cancel queued requests.
    runs-on: ${{ fromJSON(vars.CODEX_WORK_RUNS_ON) }}
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
          clean: false
      # Reuse the service account's CLI and tools. No per-run installation.
      - name: Implement and deliver
        uses: actions/github-script@v7
        env:
          CODEX_AUTOMATION_CONFIG: ${{ vars.CODEX_AUTOMATION_CONFIG }}
          # Match this name to webhookEnv in the project's config; keep existing secret names.
          HARNESS_NOTIFICATION_URL: ${{ secrets.HARNESS_NOTIFICATION_URL }}
        with:
          retries: 0
          script: |
            const { run } = await import(`${process.env.GITHUB_WORKSPACE}/.github/codex/automation.mjs`);
            await run(github, context, core);

  report_setup_failure:
    needs: [authorize, work]
    if: >-
      always() && github.event.repository.private == true && github.event.sender.type == 'User' &&
      (needs.authorize.result == 'failure' || needs.work.result == 'failure')
    runs-on: ${{ fromJSON(vars.CODEX_AUTH_RUNS_ON) }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # No checkout/import: this also works when checkout or module loading failed.
      - uses: actions/github-script@v7
        with:
          retries: 0
          script: |
            const url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await core.summary.addRaw(`작업 실패. 실행 단계와 보존 상태 확인: ${url}`).write();
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ ...context.repo, username: context.payload.sender.login });
              if (!['admin', 'maintain', 'write'].includes(data.permission)) return;
              const issue_number = context.payload.issue.number;
              const marker = `<!-- codex-failure:${context.runId} -->`;
              const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number, per_page: 100 });
              if (comments.some(c => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker))) return;
              await github.rest.issues.createComment({ ...context.repo, issue_number,
                body: `${marker}\n실행 실패. 원인과 실제 검증·전달 상태 확인: ${url}\n초기 준비 실패이면 모델은 호출되지 않았을 수 있음. 실패 단계부터 복구 필요.` });
            } catch {
              // No blind write retries; leave the first failure in the Actions log.
              core.warning('실패 댓글 전달 미확인. 원격 확인 전 쓰기 요청을 반복하지 않음');
            }
